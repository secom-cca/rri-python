<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>流域治水シミュレーター</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M0 12 Q4 8 8 12 T16 12 V16 H0Z' fill='%231f6fd1'/></svg>">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <aside id="left">
    <h1>流域治水シミュレーター <small>RRI-python</small></h1>

    <section>
      <label>流域 <select id="basin"></select></label>
      <label>洪水イベント <select id="event"></select></label>
      <div class="hint" id="basin-info"></div>
    </section>

    <section>
      <h2>施策ツール</h2>
      <div id="tools" class="tools">
        <button data-tool="view" class="active" title="ドラッグで視点回転、右ドラッグで移動、ホイールで拡大">🖐 視点</button>
        <button data-tool="forest" title="土地利用を森林に変更">🌲 森林化</button>
        <button data-tool="paddy_dam" title="水田セルに田んぼダム（排水調整板）を設置">🌾 田んぼダム</button>
        <button data-tool="relocate" title="住宅・事業所を浸水域外へ移転（資産を除去）">🏠→ 移転</button>
        <button data-tool="raise" title="住宅の嵩上げ（床高）／盛土">⬆ 嵩上げ</button>
        <button data-tool="levee" title="範囲内の河道に堤防を設置">🧱 堤防</button>
        <button data-tool="retention" title="遊水地：掘削＋越流堤">◯ 遊水地</button>
        <button data-tool="erase" title="塗った範囲の施策を取り消す">⌫ 消去</button>
      </div>
      <label>ブラシ半径 <input id="brush" type="range" min="0" max="8" value="2"> <span id="brush-v">2</span> セル</label>
      <div id="tool-params">
        <div data-for="raise"><label>嵩上げ高 <input id="raise-h" type="number" value="1.0" step="0.5" min="0.5" max="5"> m</label>
          <label class="chk"><input id="raise-terrain" type="checkbox"> 盛土（地盤ごと上げ、流れにも影響）</label></div>
        <div data-for="levee"><label>堤防高（地盤から） <input id="levee-h" type="number" value="3.0" step="0.5" min="0.5" max="15"> m</label></div>
        <div data-for="retention"><label>掘削深 <input id="ret-d" type="number" value="3.0" step="0.5" min="0.5" max="10"> m</label>
          <label>越流堤の高さ <input id="ret-inlet" type="number" value="1.5" step="0.5" min="0" max="10"> m</label></div>
        <div data-for="forest"><label>新規森林の粗度 n <input id="fo-n" type="number" value="0.4" step="0.05" min="0.05" max="1"></label>
          <label>森林土層厚 <input id="fo-soil" type="number" value="1.0" step="0.1" min="0.2" max="3"> m</label>
          <div class="hint">既存の森林・水域は対象外。校正済み山地森林とは別クラスとして計算。</div></div>
        <div data-for="paddy_dam"><label>貯留深 <input id="pd-store" type="number" value="15" step="1" min="1" max="30"> cm</label>
          <label>最大放流量 <input id="pd-rel" type="number" value="5" step="0.5" min="0.5" max="50"> mm/h</label></div>
      </div>
      <div class="hint" id="tool-hint">「視点」でドラッグ＝回転。施策ツール選択中は左ドラッグで塗る（右ドラッグ＝移動）。</div>
    </section>

    <section>
      <h2>施策リスト</h2>
      <ul id="edits"></ul>
      <div class="row">
        <button id="run" class="primary">▶ 洪水計算を実行</button>
        <button id="clear">全消去</button>
      </div>
      <div id="progress"><div id="bar"></div><span id="pmsg"></span></div>
    </section>

    <section>
      <h2>表示</h2>
      <div class="tools" id="modes">
        <button data-mode="landuse" class="active">土地利用</button>
        <button data-mode="flood">浸水深</button>
        <button data-mode="damage">被害額</button>
        <button data-mode="diff">差分（施策−現況）</button>
      </div>
      <div class="tools" id="which">
        <button data-which="base">現況</button>
        <button data-which="scen" class="active">施策</button>
      </div>
      <label>鉛直強調 <input id="exag" type="range" min="1" max="6" step="0.5" value="2.5"> <span id="exag-v">2.5</span>×</label>
      <label class="chk"><input id="show-assets" type="checkbox" checked> 資産（世帯）を表示</label>
      <label class="chk"><input id="show-river" type="checkbox" checked> 河道・堤防を表示</label>
    </section>
  </aside>

  <main id="view">
    <div id="legend"></div>
    <div id="hover"></div>
    <div id="timebar">
      <button id="play">▶</button>
      <input id="time" type="range" min="0" max="0" value="0">
      <span id="time-label">最大浸水深</span>
      <button id="tmax" title="期間最大を表示">最大</button>
    </div>
  </main>

  <aside id="right">
    <section>
      <h2>被害額（治水経済調査マニュアル準拠）</h2>
      <div id="kpis"></div>
      <canvas id="dmg-chart" height="190"></canvas>
    </section>
    <section>
      <h2>流量ハイドログラフ <select id="gauge"></select></h2>
      <canvas id="q-chart" height="210"></canvas>
    </section>
    <section>
      <h2>計算ログ</h2>
      <div id="log" class="log"></div>
    </section>
  </aside>
</div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
